<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[X~Y~Z] Overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<!-- Layer 1: habitat scene -->
<canvas id="bg"></canvas>
<!-- Layer 2: creature + animations -->
<canvas id="mid"></canvas>
<!-- Layer 3: UI -->
<div id="ui">
  <div id="logo">[X~Y~Z]</div>
  <div id="title"></div>

  <aside id="legend"><ul id="legend-list"></ul></aside>

  <aside id="board" hidden>
    <h2>Liderler</h2>
    <ol id="board-list"></ol>
  </aside>

  <div id="toast" aria-live="off"></div>

  <div id="goal"></div>

  <div id="growth">
    <div class="meta">
      <span id="creature-name"></span>
      <span id="growth-pct"></span>
    </div>
    <div class="bar"><i id="bar-fill"></i></div>
  </div>

  <div id="chat"></div>
  <div id="finale"></div>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
